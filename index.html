*{
    margin:0;

    font-family:'Inter',sans-serif;

body{
    background:#14AAF2;
    color:#e5e5e5;
    min-height:100vh;
}

.container{
    width:min(92%,800px);
    margin:auto;
    padding:40px 0;
}

.box{
    background:#A217F5;
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    margin-bottom:32px;
    padding:25px;
    box-shadow:
    0 0 25px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.03);

    animation:fadeUp .7s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.section-title{
    text-align:center;
    font-size:1.2rem;
    font-weight:600;
    margin-bottom:20px;
    color:#f1f1f1;
}

/* ---------------- */
/* PIN BOX */
/* ---------------- */

.pin-display{
    width:100%;
    height:60px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);
    background:#001F60;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:1.3rem;
    letter-spacing:4px;
    color:#fff;
}

.pin-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.pin-btn{
    height:65px;
    border:none;
    border-radius:18px;

    background:#001F60;
    color:white;

    font-size:1.2rem;
    cursor:pointer;

    transition:.25s;
}

.pin-btn:hover{
    background:#2d2d2d;
    transform:translateY(-2px);
}

.send-btn{
    margin-top:15px;
    width:100%;
    height:58px;

    border:none;
    border-radius:18px;

    background:#001F60;
    color:white;

    font-size:1rem;
    font-weight:600;
    cursor:pointer;

    transition:.25s;
}

.send-btn:hover{
    background:#404040;
}

.hidden{
    display:none;
}

.secret-content{
    min-height:320px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:1.15rem;
    line-height:1.8;

    color:#cfcfcf;
    font-weight:500;
}

/* ---------------- */
/* IMAGE + TEXT BOX */
/* ---------------- */

.image-box img{
    width:100%;
    max-height:450px;
    object-fit:contain;

    border-radius:18px;
    display:block;
}

.text-content{
    margin-top:20px;

    line-height:1.9;
    text-align:center;

    color:#d7d7d7;
    font-size:1rem;
}

/* ---------------- */
/* SLIDER */
/* ---------------- */

.slider-wrapper{
    position:relative;
    overflow:hidden;
    border-radius:20px;
}

.slider{
    display:flex;
    transition:transform .5s ease;
}

.slide{
    min-width:100%;
    user-select:none;
}

.slide img{
    width:100%;
    height:450px;
    object-fit:contain;
    display:block;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.45);
    color:white;

    cursor:pointer;
    z-index:10;

    transition:.25s;
}

.arrow:hover{
    background:rgba(255,255,255,.15);
}

.prev{
    left:12px;
}

.next{
    right:12px;
}

.dots{
    display:flex;
    justify-content:center;
    gap:10px;

    margin-top:18px;
}

.dot{
    width:10px;
    height:10px;

    border-radius:50%;
    background:#444;

    transition:.3s;
    cursor:pointer;
}

.dot.active{
    background:#d6d6d6;
    transform:scale(1.2);
}

/* ---------------- */
/* MOBILE */
/* ---------------- */

@media(max-width:768px){

    .box{
        padding:20px;
        border-radius:20px;
    }

    .slide img{
        height:320px;
    }

    .arrow{
        display:none;
    }

    .secret-content{
        min-height:250px;
    }

}

</style>

/* ========================= */
/* SLIDER */
/* ========================= */

const slider = document.getElementById("slider");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const dots = document.querySelectorAll(".dot");



let currentSlide = 0;
const totalSlides = 5;

function updateSlider(){

    slider.style.transform =
        `translateX(-${currentSlide * 100}%)`;

    dots.forEach(dot =>
        dot.classList.remove("active")
    );

    dots[currentSlide].classList.add("active");

}

function nextSlide(){

    currentSlide++;

    if(currentSlide >= totalSlides){
        currentSlide = 0;
    }

    updateSlider();

}

function prevSlide(){

    currentSlide--;

    if(currentSlide < 0){
        currentSlide = totalSlides - 1;
    }

    updateSlider();

}

nextBtn.addEventListener("click", nextSlide);
prevBtn.addEventListener("click", prevSlide);

dots.forEach((dot,index)=>{

    dot.addEventListener("click",()=>{

        currentSlide = index;
        updateSlider();

    });

});


/* ========================= */
/* KEYBOARD ARROWS */
/* ========================= */

document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowRight"){
        nextSlide();
    }

    if(e.key === "ArrowLeft"){
        prevSlide();
    }

});


/* ========================= */
/* MOBILE SWIPE */
/* ========================= */

let startX = 0;
let endX = 0;

slider.addEventListener("touchstart",(e)=>{

    startX = e.touches[0].clientX;

});

slider.addEventListener("touchmove",(e)=>{

    endX = e.touches[0].clientX;

});

slider.addEventListener("touchend",()=>{

    let difference = startX - endX;

    if(difference > 50){
        nextSlide();
    }

    if(difference < -50){
        prevSlide();
    }

});

updateSlider();

</script>
